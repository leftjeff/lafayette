name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only run the latest commit's CI for a given ref. Cancels stale runs
# on rapid pushes / PR force-updates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run all JavaScript-based actions on Node.js 24 instead of the deprecated
# default of Node 20. Vercel's default runtime is also Node 24, so CI and
# prod stay aligned.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
